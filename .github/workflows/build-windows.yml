name: Build DuskBloom Center for Windows

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "DuskBloomCenter.py"
      - "Bundled/**"
      - "requirements.txt"
      - "update_catalog.json"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build DuskBloom Center
    runs-on: windows-latest

    steps:
      # -------------------------------------------------------
      # Download repository
      # -------------------------------------------------------

      - name: Get DuskBloom Center
        uses: actions/checkout@v5

      # -------------------------------------------------------
      # Python
      # -------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      # -------------------------------------------------------
      # Dependencies
      # -------------------------------------------------------

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip

          if (Test-Path "requirements.txt") {
              pip install -r requirements.txt
          }

          pip install pyinstaller

      # -------------------------------------------------------
      # Show files for debugging
      # -------------------------------------------------------

      - name: Verify source files
        shell: powershell
        run: |
          Write-Host "Repository contents:"
          Get-ChildItem

          if (!(Test-Path "DuskBloomCenter.py")) {
              Write-Error "DuskBloomCenter.py is missing!"
              exit 1
          }

          if (!(Test-Path "Bundled")) {
              Write-Error "Bundled folder is missing!"
              exit 1
          }

          Write-Host ""
          Write-Host "DuskBloom Center source found."
          Write-Host "Bundled apps found."

      # -------------------------------------------------------
      # Build Center
      # -------------------------------------------------------

      - name: Build DuskBloom Center
        shell: powershell
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name "DuskBloomCenter" `
            DuskBloomCenter.py

      # -------------------------------------------------------
      # Copy bundled DuskBloom apps
      # -------------------------------------------------------

      - name: Add bundled DuskBloom apps
        shell: powershell
        run: |
          $buildFolder = "dist/DuskBloomCenter"

          if (!(Test-Path $buildFolder)) {
              Write-Error "DuskBloom Center build folder does not exist."
              exit 1
          }

          Write-Host "Copying bundled DuskBloom apps..."

          Copy-Item `
            -Path "Bundled" `
            -Destination "$buildFolder/Bundled" `
            -Recurse `
            -Force

          if (Test-Path "update_catalog.json") {
              Copy-Item `
                -Path "update_catalog.json" `
                -Destination "$buildFolder/update_catalog.json" `
                -Force
          }

      # -------------------------------------------------------
      # Verify final Center
      # -------------------------------------------------------

      - name: Verify DuskBloom Center
        shell: powershell
        run: |
          $exe = "dist/DuskBloomCenter/DuskBloomCenter.exe"
          $bundled = "dist/DuskBloomCenter/Bundled"

          if (!(Test-Path $exe)) {
              Write-Error "DuskBloomCenter.exe was not created!"
              exit 1
          }

          if (!(Test-Path $bundled)) {
              Write-Error "Bundled apps were not copied!"
              exit 1
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " DuskBloom Center build successful"
          Write-Host "=========================================="
          Write-Host ""

          Get-Item $exe

          Write-Host ""
          Write-Host "Bundled apps:"
          Get-ChildItem $bundled

      # -------------------------------------------------------
      # Package
      # -------------------------------------------------------

      - name: Package DuskBloom Center
        shell: powershell
        run: |
          $zip = "DuskBloomCenter-v1.0.4-Windows-x64.zip"

          if (Test-Path $zip) {
              Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "dist/DuskBloomCenter/*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          if (!(Test-Path $zip)) {
              Write-Error "DuskBloom Center ZIP was not created."
              exit 1
          }

          Write-Host ""
          Write-Host "Package created:"
          Get-Item $zip

      # -------------------------------------------------------
      # Upload downloadable build
      # -------------------------------------------------------

      - name: Upload DuskBloom Center
        uses: actions/upload-artifact@v5
        with:
          name: DuskBloomCenter-v1.0.4-Windows-x64
          path: DuskBloomCenter-v1.0.4-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
