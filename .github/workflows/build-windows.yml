name: Build DuskBloom Screen for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Get DuskBloom source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build DuskBloom Screen
        shell: powershell
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onefile `
            --name "DuskBloomScreen" `
            src/DuskBloomScreen.py

      - name: Verify build
        shell: powershell
        run: |
          if (!(Test-Path "dist/DuskBloomScreen.exe")) {
            Write-Error "DuskBloomScreen.exe was not created."
            exit 1
          }

          Write-Host "DuskBloom Screen built successfully!"
          Get-Item "dist/DuskBloomScreen.exe"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: DuskBloomScreen-Windows-x64
          path: dist/DuskBloomScreen.exe
          if-no-files-found: error
