name: Build DuskBloom macOS v2.0.0

on:
  workflow_dispatch:
  push:
    branches: [duskbloom-macos-v2]
    paths:
      - "macOS/**"
      - "Bundled/DuskBloom Web/**"
      - ".github/workflows/build-macos-v2.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout DuskBloom
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller pillow pymupdf python-docx pyttsx3

      - name: Build macOS apps
        run: bash macOS/BUILD_MACOS_RELEASE.sh

      - name: Verify release
        run: test -f DuskBloom_macOS_v2.0.0.zip

      - name: Upload macOS release
        uses: actions/upload-artifact@v4
        with:
          name: DuskBloom-macOS-v2.0.0
          path: DuskBloom_macOS_v2.0.0.zip
          if-no-files-found: error
          retention-days: 30
