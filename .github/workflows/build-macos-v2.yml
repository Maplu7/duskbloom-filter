name: Build DuskBloom macOS v2.0.0
on:
  workflow_dispatch:
  push:
    branches: [duskbloom-macos-v2]
    paths:
      - "macOS/**"
      - "Bundled/DuskBloom Web/**"
      - ".github/workflows/build-macos-v2.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout DuskBloom
        uses: actions/checkout@v4
      - name: Build native macOS suite
        run: bash macOS/BUILD_MACOS_RELEASE.sh
      - name: Verify native apps
        run: |
          test -x "release_macos/DuskBloom Screen.app/Contents/MacOS/DuskBloom Screen"
          test -x "release_macos/DuskBloom Center.app/Contents/MacOS/DuskBloom Center"
          test -x "release_macos/DuskBloom Reader.app/Contents/MacOS/DuskBloom Reader"
          codesign --verify --deep --strict "release_macos/DuskBloom Screen.app"
          codesign --verify --deep --strict "release_macos/DuskBloom Center.app"
          codesign --verify --deep --strict "release_macos/DuskBloom Reader.app"
          test -f DuskBloom_macOS_v2.0.0.zip
      - name: Upload macOS release
        uses: actions/upload-artifact@v4
        with:
          name: DuskBloom-macOS-v2.0.0
          path: DuskBloom_macOS_v2.0.0.zip
          if-no-files-found: error
          retention-days: 30
