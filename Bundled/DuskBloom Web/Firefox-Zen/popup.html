<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{
  width:330px;margin:0;padding:16px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(180deg,#20151e,#141116);
  color:#f7edf3;
}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.flower{font-size:25px;filter:none}
h1{font-size:17px;margin:0}.sub{font-size:11px;color:#cdbec8;margin-top:2px}
.switch{position:relative;width:48px;height:27px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;border-radius:99px;background:#514650;transition:.18s}
.slider:before{content:"";position:absolute;width:21px;height:21px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.18s}
.switch input:checked+.slider{background:#d58faf}
.switch input:checked+.slider:before{transform:translateX(21px)}
.card{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:12px;margin-top:10px}
.title{font-size:12px;font-weight:700;margin-bottom:9px;color:#eadde5}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:7px}
button{
 border:1px solid rgba(255,255,255,.10);background:#2b232a;color:#eee4ea;
 padding:8px 9px;border-radius:9px;cursor:pointer;text-align:left;font-size:12px
}
button:hover{background:#392c35}
button.active{outline:2px solid #e3a1bf;background:#422b38;color:white}
.colors{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.colorrow{display:flex;align-items:center;justify-content:space-between;background:#2a2228;border-radius:9px;padding:7px 9px;font-size:11px}
input[type=color]{width:31px;height:24px;border:0;padding:0;background:transparent}
.apply{width:100%;text-align:center;margin-top:9px;background:#5a3447}
.status{font-size:11px;color:#bfaeb9;margin-top:10px;text-align:center}
</style>
</head>
<body>
  <div class="top">
    <div class="brand"><div class="flower">✿</div><div><h1>DuskBloom Web</h1><div class="sub">soft color protection for bright pages</div></div></div>
    <label class="switch"><input id="enabled" type="checkbox"><span class="slider"></span></label>
  </div>

  <div class="card">
    <div class="title">Theme presets</div>
    <div class="presets">
      <button data-preset="pink_blackout">Pink Blackout</button>
      <button data-preset="pink">Pink</button>
      <button data-preset="dark_pink">Dark Pink</button>
      <button data-preset="rose_dim">Rose Dim</button>
      <button data-preset="dusty_rose">Dusty Rose</button>
      <button data-preset="peach">Peach</button>
      <button data-preset="sepia">Sepia</button>
      <button data-preset="sage">Sage</button>
      <button data-preset="soft_cyan">Soft Cyan</button>
      <button data-preset="mauve">Mauve</button>
      <button data-preset="smoke">Smoke</button>
      <button data-preset="cocoa">Cocoa</button>
      <button data-preset="navy">Navy</button>
      <button data-preset="burgundy">Burgundy</button>
      <button data-preset="lavender">Lavender</button>
      <button data-preset="amber">Amber</button>
      <button data-preset="forest_green">Forest Green</button>
      <button data-preset="warm_white">Warm White</button>
      <button data-preset="deep_red">Deep Red</button>
      <button data-preset="blue_light">Blue Light</button>
      <button data-preset="dark_dimmer">Dark Dimmer</button>
      <button data-preset="midnight">Midnight</button>
      <button data-preset="obsidian">Obsidian</button>
    </div>
  </div>

  <div class="card">
    <div class="title">My Colors</div>
    <div class="colors">
      <label class="colorrow">Background <input id="customBg" type="color"></label>
      <label class="colorrow">Panels <input id="customPanel" type="color"></label>
      <label class="colorrow">Raised <input id="customRaised" type="color"></label>
      <label class="colorrow">Text <input id="customText" type="color"></label>
      <label class="colorrow">Muted <input id="customMuted" type="color"></label>
      <label class="colorrow">Accent <input id="customAccent" type="color"></label>
    </div>
    <button class="apply" id="applyCustom">Use My Colors</button>
  </div>
  <div class="status" id="status"></div>
<script src="popup.js"></script>
</body></html>
